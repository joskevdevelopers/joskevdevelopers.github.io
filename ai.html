
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with Kim's AI - Joskev Developers virtual assistant">
    <title>Kim's AI | Joskev Developers</title>

    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        :root {
            --wa-dark: #111b21;
            --wa-panel: #202c33;
            --wa-panel-2: #182229;
            --wa-input: #2a3942;
            --wa-text: #e9edef;
            --wa-muted: #8696a0;
            --wa-green: #25d366;
            --wa-green-dark: #128c7e;
            --wa-user: #005c4b;
            --wa-border: rgba(255,255,255,.09);
            --page-bg: #071116;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--wa-text);
            background:
                linear-gradient(rgba(3,10,14,.82), rgba(3,10,14,.88)),
                url("assets/kim-ai-computing-bg.png") center center / cover fixed no-repeat,
                var(--page-bg);
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
        }

        .chat-app {
            width: min(820px, 100%);
            height: min(760px, calc(100vh - 36px));
            min-height: 520px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(17, 27, 33, .94);
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 18px;
            box-shadow:
                0 24px 70px rgba(0,0,0,.55),
                0 0 45px rgba(37,211,102,.08);
            backdrop-filter: blur(10px);
        }

        /* HEADER */
        .chat-header {
            min-height: 68px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 14px;
            background: linear-gradient(135deg, rgba(32,44,51,.97), rgba(24,34,41,.97));
            border-bottom: 1px solid var(--wa-border);
        }

        .brand {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            font-size: 19px;
            background: linear-gradient(135deg, var(--wa-green), var(--wa-green-dark));
            box-shadow: 0 0 18px rgba(37,211,102,.22);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-status {
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--wa-muted);
            font-size: 11px;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--wa-green);
            box-shadow: 0 0 8px rgba(37,211,102,.65);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #aebac1;
            cursor: pointer;
            transition: .2s ease;
        }

        .icon-btn:hover {
            color: #fff;
            background: rgba(255,255,255,.08);
        }

        /* CHAT */
        .chat-body {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(rgba(7,17,22,.54), rgba(7,17,22,.54)),
                url("assets/kim-ai-computing-bg.png") center center / cover no-repeat;
        }

        .messages {
            height: 100%;
            overflow-y: auto;
            padding: 18px clamp(12px, 6vw, 58px) 22px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.14);
            border-radius: 10px;
        }

        .date-divider {
            align-self: center;
            margin: 2px 0 12px;
            padding: 6px 11px;
            border-radius: 8px;
            background: rgba(31,44,52,.92);
            color: #b8c4ca;
            font-size: 10px;
        }

        .message-row {
            width: 100%;
            display: flex;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .bubble {
            position: relative;
            max-width: min(74%, 560px);
            padding: 9px 11px 18px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            box-shadow: 0 1px 2px rgba(0,0,0,.17);
        }

        .bubble.ai {
            background: rgba(32,44,51,.94);
            color: var(--wa-text);
            border-top-left-radius: 3px;
        }

        .bubble.user {
            background: rgba(0,92,75,.96);
            color: #e9edef;
            border-top-right-radius: 3px;
        }

        .time {
            position: absolute;
            right: 7px;
            bottom: 4px;
            color: #8696a0;
            font-size: 9px;
        }

        .bubble.user .time {
            color: rgba(255,255,255,.62);
        }

        .typing-row {
            display: none;
            justify-content: flex-start;
        }

        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 9px 12px;
            border-radius: 9px;
            border-top-left-radius: 3px;
            background: rgba(32,44,51,.94);
        }

        .typing-bubble span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #95a4ad;
            animation: blink 1.2s infinite;
        }

        .typing-bubble span:nth-child(2) { animation-delay: .18s; }
        .typing-bubble span:nth-child(3) { animation-delay: .36s; }

        @keyframes blink {
            0%, 60%, 100% { transform: translateY(0); opacity: .35; }
            30% { transform: translateY(-3px); opacity: 1; }
        }

        /* WELCOME CARD */
        .welcome-card {
            align-self: center;
            width: min(560px, 92%);
            margin: auto;
            padding: 22px 20px;
            text-align: center;
            border-radius: 16px;
            background: rgba(17,27,33,.84);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 12px 35px rgba(0,0,0,.22);
        }

        .welcome-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 10px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            font-size: 23px;
            background: linear-gradient(135deg, var(--wa-green), var(--wa-green-dark));
        }

        .welcome-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .welcome-text {
            color: #b9c5cb;
            font-size: 12px;
            line-height: 1.65;
        }

        .quick-actions {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
        }

        .quick-btn {
            padding: 8px 11px;
            border: 1px solid rgba(37,211,102,.34);
            border-radius: 18px;
            background: rgba(37,211,102,.07);
            color: #d9fdd3;
            font-size: 11px;
            cursor: pointer;
            transition: .2s ease;
        }

        .quick-btn:hover {
            background: rgba(37,211,102,.15);
        }

        /* COMPOSER */
        .composer {
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 9px 11px;
            background: rgba(32,44,51,.98);
            border-top: 1px solid var(--wa-border);
        }

        .input-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        #messageInput {
            width: 100%;
            min-height: 45px;
            max-height: 120px;
            resize: none;
            border: 0;
            outline: none;
            padding: 12px 14px;
            border-radius: 23px;
            background: var(--wa-input);
            color: #fff;
            font-size: 13px;
            line-height: 1.4;
            overflow-y: auto;
        }

        #messageInput::placeholder {
            color: #8696a0;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            flex: 0 0 45px;
            border: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--wa-green), var(--wa-green-dark));
            color: #fff;
            cursor: pointer;
            transition: .2s ease;
        }

        .send-btn:hover {
            transform: scale(1.04);
        }

        .send-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .secure-note {
            flex-shrink: 0;
            padding: 3px 8px 7px;
            text-align: center;
            background: rgba(32,44,51,.98);
            color: #667781;
            font-size: 9px;
        }

        .secure-note i {
            margin-right: 4px;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            body {
                overflow: hidden;
            }

            .page {
                padding: 0;
            }

            .chat-app {
                width: 100%;
                height: 100vh;
                min-height: 0;
                border: 0;
                border-radius: 0;
            }

            .chat-header {
                min-height: 64px;
            }

            .avatar {
                width: 41px;
                height: 41px;
                flex-basis: 41px;
            }

            .messages {
                padding: 14px 9px 18px;
            }

            .bubble {
                max-width: 86%;
                font-size: 13px;
            }

            .welcome-card {
                width: 94%;
                padding: 19px 15px;
            }

            .header-actions .home-btn {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .brand-name {
                font-size: 15px;
            }

            .brand-status {
                font-size: 10px;
            }

            .bubble {
                max-width: 91%;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <section class="chat-app" aria-label="Kim's AI chat">

        <header class="chat-header">
            <div class="brand">
                <div class="avatar" aria-hidden="true">
                    <i class="fa-solid fa-robot"></i>
                </div>

                <div class="brand-text">
                    <div class="brand-name">Kim's AI</div>
                    <div class="brand-status">
                        <span class="online-dot"></span>
                        Online • Joskev Developers
                    </div>
                </div>
            </div>

            <div class="header-actions">
                <button class="icon-btn home-btn" id="homeBtn" type="button" aria-label="Go to home" title="Home">
                    <i class="fa-solid fa-house"></i>
                </button>

                <button class="icon-btn" id="clearBtn" type="button" aria-label="Clear conversation" title="Clear chat">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </header>

        <main class="chat-body">
            <div class="messages" id="messages">

                <div class="date-divider">Today</div>

                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">
                        <i class="fa-solid fa-robot"></i>
                    </div>

                    <div class="welcome-title">Welcome to Kim's AI</div>

                    <div class="welcome-text">
                        Your virtual assistant from <strong>Joskev Developers</strong>.<br>
                        Ask about SmartPOS, software development, websites, M-Pesa integration,
                        cybersecurity, graphic design, or our services.
                    </div>

                    <div class="quick-actions">
                        <button class="quick-btn" type="button" data-message="Hello">👋 Say Hello</button>
                        <button class="quick-btn" type="button" data-message="What services do you offer?">💻 Services</button>
                        <button class="quick-btn" type="button" data-message="Tell me about SmartPOS">🧾 SmartPOS</button>
                        <button class="quick-btn" type="button" data-message="How can I contact Joskev Developers?">📞 Contact</button>
                    </div>
                </div>

                <div class="typing-row" id="typingRow">
                    <div class="typing-bubble">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </main>

        <div class="composer">
            <div class="input-wrap">
                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="Type a message"
                    autocomplete="off"
                    spellcheck="true"
                    aria-label="Message"
                ></textarea>
            </div>

            <button class="send-btn" id="sendBtn" type="button" aria-label="Send message">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <div class="secure-note">
            <i class="fa-solid fa-lock"></i>
            Messages are processed securely by Kim's AI.
        </div>
    </section>
</div>

<script>
    const KIM_AI_URL =
        "https://gosgcgajdecgtceniveh.supabase.co/functions/v1/kims-ai";

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const typingRow = document.getElementById("typingRow");
    const welcomeCard = document.getElementById("welcomeCard");
    const clearBtn = document.getElementById("clearBtn");
    const homeBtn = document.getElementById("homeBtn");

    function getTime() {
        return new Intl.DateTimeFormat(undefined, {
            hour: "numeric",
            minute: "2-digit"
        }).format(new Date());
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(text, sender) {
        const row = document.createElement("div");
        row.className = `message-row ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = `bubble ${sender}`;
        bubble.innerHTML = `${escapeHtml(text)}<span class="time">${getTime()}</span>`;

        row.appendChild(bubble);
        messages.insertBefore(row, typingRow);
        scrollToBottom();
    }

    function showTyping() {
        typingRow.style.display = "flex";
        scrollToBottom();
    }

    function hideTyping() {
        typingRow.style.display = "none";
    }

    function removeWelcome() {
        if (welcomeCard) {
            welcomeCard.style.display = "none";
        }
    }

    function autoResize() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    async function sendMessage(predefinedMessage = null) {
        const message = String(predefinedMessage ?? input.value).trim();

        if (!message || sendBtn.disabled) {
            return;
        }

        removeWelcome();
        addMessage(message, "user");

        input.value = "";
        autoResize();

        input.disabled = true;
        sendBtn.disabled = true;
        showTyping();

        try {
            const response = await fetch(KIM_AI_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ message })
            });

            const contentType = response.headers.get("content-type") || "";
            let data = null;

            if (contentType.includes("application/json")) {
                data = await response.json();
            } else {
                const text = await response.text();
                throw new Error(`Server returned HTTP ${response.status}: ${text.slice(0, 200)}`);
            }

            if (!response.ok || !data?.success) {
                throw new Error(
                    data?.error || `Kim's AI returned HTTP ${response.status}`
                );
            }

            hideTyping();
            addMessage(data.response || "I received your message, but I don't have a reply yet.", "ai");
        } catch (error) {
            console.error("Kim's AI error:", error);
            hideTyping();
            addMessage(
                "Sorry, I couldn't connect to Kim AI right now. Please try again.",
                "ai"
            );
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    input.addEventListener("input", autoResize);

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    document.querySelectorAll(".quick-btn").forEach((button) => {
        button.addEventListener("click", () => {
            sendMessage(button.dataset.message || "");
        });
    });

    clearBtn.addEventListener("click", () => {
        const confirmed = window.confirm("Clear this conversation?");
        if (!confirmed) return;

        messages.querySelectorAll(".message-row.ai, .message-row.user").forEach((row) => row.remove());
        welcomeCard.style.display = "block";
        hideTyping();
        scrollToBottom();
    });

    homeBtn.addEventListener("click", () => {
        window.location.href = "index.html";
    });

    input.focus();
    scrollToBottom();
</script>

</body>
</html>
