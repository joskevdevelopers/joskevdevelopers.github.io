            display: flex;
            align-items: center;

            height: 6px;

            background: rgba(32,44,51,.98);

<div class="page">

        <header class="chat-header">
            <div class="brand">
                <div class="avatar" aria-hidden="true">

                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

            <i class="fa-solid fa-lock"></i>
            Messages are processed securely by Kim's AI.
        </div>
    </section>

        gap: 7px;

        padding:
            8px
            10px
            8px;

        background: rgba(32,44,51,.99);

        border-top: 1px solid var(--wa-border);

        padding-bottom:
            max(8px, env(safe-area-inset-bottom));
    }

    .input-wrap {
        flex: 1 1 auto;

        min-width: 0;

        position: relative;
    }

    #messageInput {
        display: block;

        width: 100%;

        min-height: 45px;
        max-height: 120px;

        resize: none;

        border: 0;
        outline: none;

        padding:
            12px
            14px;

        border-radius: 23px;

        background: var(--wa-input);

        color: #fff;

        font-size: 14px;

        line-height: 1.4;

        overflow-y: auto;

        -webkit-appearance: none;
        appearance: none;
    }

    #messageInput::placeholder {
        color: #8696a0;
    }

    #messageInput:disabled {
        opacity: .7;
    }

    .send-btn {
        width: 45px;
        height: 45px;

        flex: 0 0 45px;

        border: 0;

        border-radius: 50%;

        display: grid;
        place-items: center;

        background:
            linear-gradient(
                135deg,
                var(--wa-green),
                var(--wa-green-dark)
            );

        color: #fff;

        cursor: pointer;

        transition: .2s ease;
    }

    .send-btn:hover {
        transform: scale(1.04);
    }

    .send-btn:active {
        transform: scale(.94);
    }

    .send-btn:disabled {
        opacity: .45;

        cursor: not-allowed;

        transform: none;
    }

    /* =========================================
       SECURITY NOTE
    ========================================= */

    .secure-note {
        flex: 0 0 auto;

        padding:
            3px
            8px
            7px;

        text-align: center;

        background: rgba(32,44,51,.99);

        color: #667781;

        font-size: 9px;
    }

    .secure-note i {
        margin-right: 4px;
    }

    /* =========================================
       TABLETS
    ========================================= */

    @media (max-width: 700px) {

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100dvh;
        }

        .page {
            width: 100%;
            height: 100dvh;

            min-height: 100dvh;

            padding: 0;

            display: block;
        }

        .chat-app {
            width: 100%;
            height: 100dvh;

            min-height: 0;

            border: 0;
            border-radius: 0;

            box-shadow: none;

            backdrop-filter: none;
        }

        /* HEADER */

        .chat-header {
            min-height: 60px;
            height: 60px;

            flex-basis: 60px;

            padding:
                7px
                10px;
        }

        .avatar {
            width: 40px;
            height: 40px;

            flex-basis: 40px;

            font-size: 17px;
        }

        .brand {
            gap: 9px;
        }

        .brand-name {
            font-size: 15px;
        }

        .brand-status {
            font-size: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
        }

        /* MESSAGES */

        .messages {
            padding:
                12px
                8px
                14px;

            gap: 6px;
        }

        .date-divider {
            margin:
                1px
                0
                9px;

            padding:
                5px
                9px;

            font-size: 9px;
        }

        /* BUBBLES */

        .bubble {
            max-width: 88%;

            padding:
                8px
                10px
                18px;

            font-size: 13px;

            line-height: 1.48;
        }

        .message-row.user .bubble {
            max-width: 86%;
        }

        /* WELCOME */

        .welcome-card {
            width: calc(100% - 14px);

            max-width: 500px;

            margin:
                auto
                0;

            padding:
                18px
                14px;

            border-radius: 14px;
        }

        .welcome-icon {
            width: 50px;
            height: 50px;

            font-size: 20px;

            margin-bottom: 9px;
        }

        .welcome-title {
            font-size: 18px;

            margin-bottom: 6px;
        }

        .welcome-text {
            font-size: 11.5px;

            line-height: 1.6;
        }

        .quick-actions {
            margin-top: 12px;

            gap: 6px;
        }

        .quick-btn {
            padding:
                8px
                10px;

            font-size: 10.5px;
        }

        /* COMPOSER */

        .composer {
            gap: 6px;

            padding:
                7px
                8px
                max(7px, env(safe-area-inset-bottom));
        }

        #messageInput {
            min-height: 44px;

            padding:
                11px
                13px;

            font-size: 14px;

            border-radius: 22px;
        }

        .send-btn {
            width: 44px;
            height: 44px;

            flex-basis: 44px;
        }

        .secure-note {
            padding:
                2px
                7px
                max(6px, env(safe-area-inset-bottom));

            font-size: 8px;
        }

        .header-actions .home-btn {
            display: none;
        }
    }

    /* =========================================
       SMALL PHONES
    ========================================= */

    @media (max-width: 400px) {

        .chat-header {
            height: 57px;
            min-height: 57px;
            flex-basis: 57px;

            padding:
                6px
                8px;
        }

        .avatar {
            width: 38px;
            height: 38px;

            flex-basis: 38px;

            font-size: 16px;
        }

        .brand-name {
            font-size: 14px;
        }

        .brand-status {
            font-size: 9px;
        }

        .messages {
            padding:
                9px
                6px
                12px;
        }

        .bubble,
        .message-row.user .bubble {
            max-width: 92%;
        }

        .bubble {
            font-size: 12.5px;

            padding:
                8px
                9px
                17px;
        }

        .welcome-card {
            width: calc(100% - 6px);

            padding:
                16px
                11px;
        }

        .welcome-title {
            font-size: 17px;
        }

        .welcome-text {
            font-size: 11px;
        }

        .quick-btn {
            font-size: 10px;

            padding:
                7px
                9px;
        }

        .composer {
            padding-left: 6px;
            padding-right: 6px;
        }

        #messageInput {
            min-height: 43px;

            font-size: 13px;
        }

        .send-btn {
            width: 43px;
            height: 43px;

            flex-basis: 43px;
        }
    }

    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-width: 340px) {

        .brand-status {
            display: none;
        }

        .header-actions {
            gap: 0;
        }

        .messages {
            padding-left: 5px;
            padding-right: 5px;
        }

        .bubble,
        .message-row.user .bubble {
            max-width: 94%;
        }

        .welcome-card {
            padding:
                14px
                9px;
        }

        .welcome-icon {
            width: 46px;
            height: 46px;

            font-size: 18px;
        }

        .welcome-title {
            font-size: 16px;
        }

        .quick-btn {
            padding:
                7px
                8px;

            font-size: 9.5px;
        }
    }

    /* =========================================
       LANDSCAPE PHONES
    ========================================= */

    @media (max-width: 700px) and (orientation: landscape) {

        .chat-header {
            height: 54px;
            min-height: 54px;
            flex-basis: 54px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            flex-basis: 36px;
        }

        .welcome-card {
            padding:
                10px
                14px;
        }

        .welcome-icon {
            width: 40px;
            height: 40px;

            margin-bottom: 5px;
        }

        .welcome-title {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .welcome-text {
            font-size: 10px;
        }

        .quick-actions {
            margin-top: 7px;
        }

        .quick-btn {
            padding:
                5px
                8px;
        }

        .messages {
            padding-top: 7px;
            padding-bottom: 8px;
        }

        .secure-note {
            display: none;
        }
    }
</style>

</body>
</html>
