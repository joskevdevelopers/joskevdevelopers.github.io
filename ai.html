<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Chat with Kim's AI - Joskev Developers virtual assistant">
    <title>Kim's AI | Joskev Developers</title>

    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        :root {
            --wa-dark: #111b21;
            --wa-panel: #202c33;
            --wa-panel-2: #182229;
            --wa-input: #2a3942;
            --wa-text: #e9edef;
            --wa-muted: #8696a0;
            --wa-green: #25d366;
            --wa-green-dark: #128c7e;
            --wa-user: #005c4b;
            --wa-border: rgba(255,255,255,.09);
            --page-bg: #071116;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--wa-text);

            background:
                linear-gradient(
                    rgba(3,10,14,.82),
                    rgba(3,10,14,.88)
                ),
                url("assets/kim-ai-computing-bg.png")
                center center / cover fixed no-repeat,
                var(--page-bg);

            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================
           PAGE
        ========================================= */

        .page {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 18px;
        }

        /* =========================================
           CHAT APPLICATION
        ========================================= */

        .chat-app {
            width: min(820px, 100%);
            height: min(760px, calc(100vh - 36px));

            min-height: 520px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: rgba(17, 27, 33, .94);

            border: 1px solid rgba(255,255,255,.11);
            border-radius: 18px;

            box-shadow:
                0 24px 70px rgba(0,0,0,.55),
                0 0 45px rgba(37,211,102,.08);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* =========================================
           HEADER
        ========================================= */

        .chat-header {
            min-height: 68px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 9px 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(32,44,51,.97),
                    rgba(24,34,41,.97)
                );

            border-bottom: 1px solid var(--wa-border);
        }

        .brand {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 11px;
        }

        .avatar {
            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: #fff;
            font-size: 19px;

            background:
                linear-gradient(
                    135deg,
                    var(--wa-green),
                    var(--wa-green-dark)
                );

            box-shadow:
                0 0 18px rgba(37,211,102,.22);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-status {
            margin-top: 3px;

            display: flex;
            align-items: center;

            gap: 6px;

            color: var(--wa-muted);
            font-size: 11px;
        }

        .online-dot {
            width: 7px;
            height: 7px;

            flex: 0 0 7px;

            border-radius: 50%;

            background: var(--wa-green);

            box-shadow:
                0 0 8px rgba(37,211,102,.65);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background: transparent;

            color: #aebac1;

            cursor: pointer;

            transition: .2s ease;

            display: grid;
            place-items: center;

            -webkit-appearance: none;
            appearance: none;

            touch-action: manipulation;
        }

        .icon-btn:hover {
            color: #fff;
            background: rgba(255,255,255,.08);
        }

        .icon-btn:active {
            transform: scale(.94);
        }

        /* =========================================
           CHAT BODY
        ========================================= */

        .chat-body {
            flex: 1 1 auto;

            min-height: 0;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(7,17,22,.54),
                    rgba(7,17,22,.54)
                ),
                url("assets/kim-ai-computing-bg.png")
                center center / cover no-repeat;
        }

        .messages {
            width: 100%;
            height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            padding:
                18px
                clamp(12px, 6vw, 58px)
                22px;

            display: flex;
            flex-direction: column;

            gap: 7px;

            scroll-behavior: smooth;

            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.14);
            border-radius: 10px;
        }

        /* =========================================
           DATE
        ========================================= */

        .date-divider {
            align-self: center;

            margin: 2px 0 12px;

            padding: 6px 11px;

            border-radius: 8px;

            background: rgba(31,44,52,.92);

            color: #b8c4ca;

            font-size: 10px;
        }

        /* =========================================
           MESSAGE ROW
        ========================================= */

        .message-row {
            width: 100%;
            display: flex;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        /* =========================================
           MESSAGE BUBBLE
        ========================================= */

        .bubble {
            position: relative;

            max-width: min(74%, 560px);

            padding: 9px 11px 18px;

            border-radius: 9px;

            font-size: 13px;
            line-height: 1.5;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            box-shadow:
                0 1px 2px rgba(0,0,0,.17);
        }

        .bubble.ai {
            background: rgba(32,44,51,.94);

            color: var(--wa-text);

            border-top-left-radius: 3px;
        }

        .bubble.user {
            background: rgba(0,92,75,.96);

            color: #e9edef;

            border-top-right-radius: 3px;
        }

        .time {
            position: absolute;

            right: 7px;
            bottom: 4px;

            color: #8696a0;

            font-size: 9px;
        }

        .bubble.user .time {
            color: rgba(255,255,255,.62);
        }

        /* =========================================
           TYPING INDICATOR
        ========================================= */

        .typing-row {
            display: none;
            justify-content: flex-start;
        }

        .typing-bubble {
            display: flex;
            align-items: center;

            gap: 4px;

            padding: 9px 12px;

            border-radius: 9px;
            border-top-left-radius: 3px;

            background: rgba(32,44,51,.94);
        }

        .typing-bubble span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #95a4ad;

            animation: blink 1.2s infinite;
        }

        .typing-bubble span:nth-child(2) {
            animation-delay: .18s;
        }

        .typing-bubble span:nth-child(3) {
            animation-delay: .36s;
        }

        @keyframes blink {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: .35;
            }

            30% {
                transform: translateY(-3px);
                opacity: 1;
            }
        }

        /* =========================================
           WELCOME CARD
        ========================================= */

        .welcome-card {
            align-self: center;

            width: min(560px, 92%);

            margin: auto;

            padding: 22px 20px;

            text-align: center;

            border-radius: 16px;

            background: rgba(17,27,33,.84);

            border: 1px solid rgba(255,255,255,.08);

            box-shadow:
                0 12px 35px rgba(0,0,0,.22);
        }

        .welcome-icon {
            width: 56px;
            height: 56px;

            margin: 0 auto 10px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: #fff;

            font-size: 23px;

            background:
                linear-gradient(
                    135deg,
                    var(--wa-green),
                    var(--wa-green-dark)
                );
        }

        .welcome-title {
            font-size: 20px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        .welcome-text {
            color: #b9c5cb;

            font-size: 12px;

            line-height: 1.65;
        }

        .quick-actions {
            margin-top: 14px;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 7px;
        }

        .quick-btn {
            padding: 8px 11px;

            border: 1px solid rgba(37,211,102,.34);

            border-radius: 18px;

            background: rgba(37,211,102,.07);

            color: #d9fdd3;

            font-size: 11px;

            cursor: pointer;

            transition: .2s ease;

            -webkit-appearance: none;
            appearance: none;

            touch-action: manipulation;
        }

        .quick-btn:hover {
            background: rgba(37,211,102,.15);
        }

        .quick-btn:active {
            transform: scale(.96);
        }

        /* =========================================
           COMPOSER
        ========================================= */

        .composer {
            width: 100%;

            flex: 0 0 auto;

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 9px 11px;

            background: rgba(32,44,51,.98);

            border-top: 1px solid var(--wa-border);

            position: relative;

            z-index: 20;
        }

        .input-wrap {
            flex: 1 1 auto;

            width: 0;

            min-width: 0;

            position: relative;
        }

        #messageInput {
            display: block;

            width: 100%;

            min-width: 0;

            min-height: 45px;

            max-height: 120px;

            resize: none;

            border: 0;

            outline: none;

            padding: 12px 14px;

            border-radius: 23px;

            background: var(--wa-input);

            color: #fff;

            font-size: 13px;

            line-height: 1.4;

            overflow-y: auto;

            -webkit-appearance: none;
            appearance: none;

            touch-action: manipulation;
        }

        #messageInput::placeholder {
            color: #8696a0;
        }

        .send-btn {
            width: 45px;
            height: 45px;

            min-width: 45px;
            min-height: 45px;

            flex: 0 0 45px;

            border: 0;

            padding: 0;
            margin: 0;

            border-radius: 50%;

            display: grid;
            place-items: center;

            background:
                linear-gradient(
                    135deg,
                    var(--wa-green),
                    var(--wa-green-dark)
                );

            color: #fff;

            cursor: pointer;

            transition: .2s ease;

            -webkit-appearance: none;
            appearance: none;

            touch-action: manipulation;

            position: relative;

            z-index: 30;

            -webkit-tap-highlight-color: transparent;
        }

        .send-btn i {
            pointer-events: none;
        }

        .send-btn:hover {
            transform: scale(1.04);
        }

        .send-btn:active {
            transform: scale(.94);
        }

        .send-btn:disabled {
            opacity: .45;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================================
           SECURE NOTE
        ========================================= */

        .secure-note {
            width: 100%;

            flex: 0 0 auto;

            padding: 3px 8px 7px;

            text-align: center;

            background: rgba(32,44,51,.98);

            color: #667781;

            font-size: 9px;

            position: relative;

            z-index: 20;
        }

        .secure-note i {
            margin-right: 4px;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            html,
            body {
                width: 100%;
                height: 100%;

                min-height: 100%;

                overflow: hidden;
            }

            body {
                min-height: 100dvh;
            }

            .page {
                width: 100%;

                height: 100dvh;

                min-height: 100dvh;

                padding: 0;

                display: block;
            }

            .chat-app {
                width: 100%;

                height: 100dvh;

                min-height: 0;

                max-height: none;

                display: flex;

                flex-direction: column;

                border: 0;

                border-radius: 0;

                box-shadow: none;

                overflow: hidden;
            }

            /* MOBILE HEADER */

            .chat-header {
                min-height: 62px;
                height: 62px;

                flex: 0 0 62px;

                padding: 8px 10px;
            }

            .avatar {
                width: 40px;
                height: 40px;

                flex: 0 0 40px;

                font-size: 17px;
            }

            .brand {
                gap: 9px;
            }

            .brand-name {
                font-size: 15px;
            }

            .brand-status {
                font-size: 10px;
            }

            .header-actions {
                gap: 2px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;

                flex: 0 0 36px;
            }

            .header-actions .home-btn {
                display: none;
            }

            /* MOBILE CHAT */

            .chat-body {
                flex: 1 1 auto;

                min-height: 0;

                height: auto;

                overflow: hidden;
            }

            .messages {
                width: 100%;

                height: 100%;

                min-height: 0;

                padding:
                    12px
                    8px
                    14px;

                overflow-x: hidden;

                overflow-y: auto;

                -webkit-overflow-scrolling: touch;

                overscroll-behavior: contain;
            }

            .date-divider {
                margin: 2px 0 10px;

                font-size: 9px;

                padding: 5px 9px;
            }

            .bubble {
                max-width: 88%;

                font-size: 13px;

                line-height: 1.45;

                padding: 9px 10px 18px;
            }

            /* MOBILE WELCOME */

            .welcome-card {
                width: calc(100% - 18px);

                max-width: 500px;

                margin: auto;

                padding: 18px 14px;
            }

            .welcome-icon {
                width: 50px;
                height: 50px;

                font-size: 20px;
            }

            .welcome-title {
                font-size: 18px;
            }

            .welcome-text {
                font-size: 11px;

                line-height: 1.6;
            }

            .quick-actions {
                gap: 6px;
            }

            .quick-btn {
                padding: 8px 10px;

                font-size: 10px;
            }

            /* MOBILE COMPOSER */

            .composer {
                width: 100%;

                flex: 0 0 auto;

                display: flex;

                align-items: flex-end;

                gap: 7px;

                padding:
                    7px
                    8px
                    calc(7px + env(safe-area-inset-bottom));

                background: rgba(32,44,51,.99);

                position: relative;

                z-index: 20;
            }

            .input-wrap {
                flex: 1 1 auto;

                width: 0;

                min-width: 0;
            }

            #messageInput {
                display: block;

                width: 100%;

                min-width: 0;

                min-height: 44px;

                max-height: 110px;

                padding: 11px 13px;

                border: 0;

                outline: none;

                border-radius: 22px;

                font-size: 16px;

                line-height: 1.35;

                -webkit-appearance: none;

                appearance: none;

                touch-action: manipulation;
            }

            .send-btn {
                display: grid;

                place-items: center;

                width: 44px;
                height: 44px;

                min-width: 44px;
                min-height: 44px;

                flex: 0 0 44px;

                border: 0;

                padding: 0;

                margin: 0;

                border-radius: 50%;

                cursor: pointer;

                -webkit-appearance: none;

                appearance: none;

                touch-action: manipulation;

                position: relative;

                z-index: 30;
            }

            .send-btn i {
                pointer-events: none;
            }

            .send-btn:active {
                transform: scale(.94);
            }

            /* MOBILE SECURITY NOTE */

            .secure-note {
                width: 100%;

                flex: 0 0 auto;

                padding:
                    3px
                    8px
                    calc(6px + env(safe-area-inset-bottom));

                font-size: 9px;

                position: relative;

                z-index: 20;
            }
        }

        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .chat-header {
                min-height: 58px;
                height: 58px;

                flex-basis: 58px;
            }

            .avatar {
                width: 38px;
                height: 38px;

                flex-basis: 38px;
            }

            .brand-name {
                font-size: 14px;
            }

            .brand-status {
                font-size: 9px;
            }

            .messages {
                padding-left: 6px;
                padding-right: 6px;
            }

            .bubble {
                max-width: 92%;

                font-size: 12px;
            }

            .welcome-card {
                width: calc(100% - 12px);

                padding: 16px 11px;
            }

            .welcome-title {
                font-size: 17px;
            }

            .quick-btn {
                font-size: 9px;

                padding: 7px 8px;
            }

            #messageInput {
                font-size: 16px;
            }

            .send-btn {
                width: 43px;
                height: 43px;

                min-width: 43px;
                min-height: 43px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <section
        class="chat-app"
        aria-label="Kim's AI chat"
    >

        <!-- HEADER -->

        <header class="chat-header">

            <div class="brand">

                <div
                    class="avatar"
                    aria-hidden="true"
                >
                    <i class="fa-solid fa-robot"></i>
                </div>

                <div class="brand-text">

                    <div class="brand-name">
                        Kim's AI
                    </div>

                    <div class="brand-status">

                        <span class="online-dot"></span>

                        Online • Joskev Developers

                    </div>

                </div>

            </div>

            <div class="header-actions">

                <button
                    class="icon-btn home-btn"
                    id="homeBtn"
                    type="button"
                    aria-label="Go to home"
                    title="Home"
                >
                    <i class="fa-solid fa-house"></i>
                </button>

                <button
                    class="icon-btn"
                    id="clearBtn"
                    type="button"
                    aria-label="Clear conversation"
                    title="Clear chat"
                >
                    <i class="fa-solid fa-trash"></i>
                </button>

            </div>

        </header>

        <!-- CHAT BODY -->

        <main class="chat-body">

            <div
                class="messages"
                id="messages"
            >

                <div class="date-divider">
                    Today
                </div>

                <!-- WELCOME -->

                <div
                    class="welcome-card"
                    id="welcomeCard"
                >

                    <div class="welcome-icon">

                        <i class="fa-solid fa-robot"></i>

                    </div>

                    <div class="welcome-title">
                        Welcome to Kim's AI
                    </div>

                    <div class="welcome-text">

                        Your virtual assistant from
                        <strong>Joskev Developers</strong>.

                        <br>

                        Ask about SmartPOS, software development,
                        websites, M-Pesa integration,
                        cybersecurity, graphic design,
                        or our services.

                    </div>

                    <div class="quick-actions">

                        <button
                            class="quick-btn"
                            type="button"
                            data-message="Hello"
                        >
                            👋 Say Hello
                        </button>

                        <button
                            class="quick-btn"
                            type="button"
                            data-message="What services do you offer?"
                        >
                            💻 Services
                        </button>

                        <button
                            class="quick-btn"
                            type="button"
                            data-message="Tell me about SmartPOS"
                        >
                            🧾 SmartPOS
                        </button>

                        <button
                            class="quick-btn"
                            type="button"
                            data-message="How can I contact Joskev Developers?"
                        >
                            📞 Contact
                        </button>

                    </div>

                </div>

                <!-- TYPING -->

                <div
                    class="typing-row"
                    id="typingRow"
                >

                    <div class="typing-bubble">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            </div>

        </main>

        <!-- COMPOSER -->

        <div class="composer">

            <div class="input-wrap">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="Type a message"
                    autocomplete="off"
                    spellcheck="true"
                    aria-label="Message"
                ></textarea>

            </div>

            <button
                class="send-btn"
                id="sendBtn"
                type="button"
                aria-label="Send message"
            >

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

        <!-- SECURITY NOTE -->

        <div class="secure-note">

            <i class="fa-solid fa-lock"></i>

            Messages are processed securely by Kim's AI.

        </div>

    </section>

</div>

<script>

    /* =========================================
       KIM AI SUPABASE FUNCTION
    ========================================= */

    const KIM_AI_URL =
        "https://gosgcgajdecgtceniveh.supabase.co/functions/v1/kims-ai";


    /* =========================================
       ELEMENTS
    ========================================= */

    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("messageInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const typingRow =
        document.getElementById("typingRow");

    const welcomeCard =
        document.getElementById("welcomeCard");

    const clearBtn =
        document.getElementById("clearBtn");

    const homeBtn =
        document.getElementById("homeBtn");


    /* =========================================
       TIME
    ========================================= */

    function getTime() {

        return new Intl.DateTimeFormat(
            undefined,
            {
                hour: "numeric",
                minute: "2-digit"
            }
        ).format(new Date());

    }


    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHtml(value) {

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }


    /* =========================================
       SCROLL
    ========================================= */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            messages.scrollTop =
                messages.scrollHeight;

        });

    }


    /* =========================================
       ADD MESSAGE
    ========================================= */

    function addMessage(text, sender) {

        const row =
            document.createElement("div");

        row.className =
            `message-row ${sender}`;


        const bubble =
            document.createElement("div");

        bubble.className =
            `bubble ${sender}`;


        bubble.innerHTML =
            `${escapeHtml(text)}
             <span class="time">
                ${getTime()}
             </span>`;


        row.appendChild(bubble);


        messages.insertBefore(
            row,
            typingRow
        );


        scrollToBottom();

    }


    /* =========================================
       TYPING
    ========================================= */

    function showTyping() {

        typingRow.style.display =
            "flex";

        scrollToBottom();

    }


    function hideTyping() {

        typingRow.style.display =
            "none";

    }


    /* =========================================
       REMOVE WELCOME
    ========================================= */

    function removeWelcome() {

        if (welcomeCard) {

            welcomeCard.style.display =
                "none";

        }

    }


    /* =========================================
       AUTO RESIZE
    ========================================= */

    function autoResize() {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                120
            ) + "px";

    }


    /* =========================================
       SEND MESSAGE
    ========================================= */

    async function sendMessage(
        predefinedMessage = null
    ) {

        const message =
            String(
                predefinedMessage ??
                input.value
            ).trim();


        if (
            !message ||
            sendBtn.disabled
        ) {

            return;

        }


        /* Remove welcome */

        removeWelcome();


        /* Show user message */

        addMessage(
            message,
            "user"
        );


        /* Clear input */

        input.value = "";

        autoResize();


        /* Lock controls */

        input.disabled = true;

        sendBtn.disabled = true;


        /* Show typing */

        showTyping();


        try {

            const response =
                await fetch(
                    KIM_AI_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message:
                                    message
                            })
                    }
                );


            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";


            let data = null;


            /* JSON response */

            if (
                contentType.includes(
                    "application/json"
                )
            ) {

                data =
                    await response.json();

            }

            /* Non JSON response */

            else {

                const text =
                    await response.text();

                throw new Error(
                    `Server returned HTTP ${response.status}: ${text.slice(0, 200)}`
                );

            }


            /* Check response */

            if (
                !response.ok ||
                !data?.success
            ) {

                throw new Error(
                    data?.error ||
                    `Kim's AI returned HTTP ${response.status}`
                );

            }


            /* Hide typing */

            hideTyping();


            /* AI response */

            addMessage(
                data.response ||
                "I received your message, but I don't have a reply yet.",
                "ai"
            );

        }

        catch (error) {

            console.error(
                "Kim's AI error:",
                error
            );


            hideTyping();


            addMessage(
                "Sorry, I couldn't connect to Kim AI right now. Please try again.",
                "ai"
            );

        }

        finally {

            input.disabled = false;

            sendBtn.disabled = false;

            input.focus();

        }

    }


    /* =========================================
       TEXTAREA INPUT
    ========================================= */

    input.addEventListener(
        "input",
        autoResize
    );


    /* =========================================
       ENTER TO SEND
    ========================================= */

    input.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();


                if (!sendBtn.disabled) {

                    sendMessage();

                }

            }

        }
    );


    /* =========================================
       SEND BUTTON
    ========================================= */

    sendBtn.addEventListener(
        "click",
        (event) => {

            event.preventDefault();

            if (!sendBtn.disabled) {

                sendMessage();

            }

        }
    );


    /* =========================================
       MOBILE TOUCH FALLBACK
    ========================================= */

    sendBtn.addEventListener(
        "touchend",
        (event) => {

            event.preventDefault();


            if (!sendBtn.disabled) {

                sendMessage();

            }

        },
        {
            passive: false
        }
    );


    /* =========================================
       QUICK BUTTONS
    ========================================= */

    document
        .querySelectorAll(".quick-btn")
        .forEach((button) => {

            button.addEventListener(
                "click",
                () => {

                    if (!sendBtn.disabled) {

                        sendMessage(
                            button.dataset.message ||
                            ""
                        );

                    }

                }
            );

        });


    /* =========================================
       CLEAR CHAT
    ========================================= */

    clearBtn.addEventListener(
        "click",
        () => {

            const confirmed =
                window.confirm(
                    "Clear this conversation?"
                );


            if (!confirmed) {

                return;

            }


            messages
                .querySelectorAll(
                    ".message-row.ai, .message-row.user"
                )
                .forEach(
                    (row) => row.remove()
                );


            welcomeCard.style.display =
                "block";


            hideTyping();


            scrollToBottom();

        }
    );


    /* =========================================
       HOME
    ========================================= */

    homeBtn.addEventListener(
        "click",
        () => {

            window.location.href =
                "index.html";

        }
    );


    /* =========================================
       START
    ========================================= */

    /* Do NOT automatically focus the input
       on mobile. This prevents the keyboard
       from opening immediately. */

    scrollToBottom();

</script>

</body>
</html>
